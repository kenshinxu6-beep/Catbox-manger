<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Kenshin Anime — File Upload</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0d1f15;
    color: #f0f5f1;
    font-family: sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  h1 {
    font-size: 1.4rem;
    font-weight: 800;
    color: #6fcf8f;
    margin-bottom: 28px;
    letter-spacing: 0.05em;
  }
  .box {
    background: #162a1e;
    border: 2px dashed #2d6b3e;
    border-radius: 16px;
    padding: 40px 32px;
    text-align: center;
    width: 100%;
    max-width: 420px;
    cursor: pointer;
    transition: border-color 0.2s;
    position: relative;
  }
  .box:hover { border-color: #4caf72; }
  .box input {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
    width: 100%;
    height: 100%;
  }
  .icon { font-size: 48px; margin-bottom: 12px; }
  .box p { color: #8aaa97; font-size: 0.85rem; margin-top: 8px; }
  #filename { color: #6fcf8f; font-size: 0.9rem; margin: 12px 0 0; font-weight: 600; }
  button {
    margin-top: 20px;
    background: #2d6b3e;
    color: #fff;
    border: none;
    padding: 13px 36px;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s;
    width: 100%;
    max-width: 420px;
  }
  button:hover { background: #4caf72; }
  button:disabled { background: #1a3d2b; color: #8aaa97; cursor: not-allowed; }
  .result {
    margin-top: 24px;
    background: #162a1e;
    border: 1px solid #2d6b3e;
    border-radius: 12px;
    padding: 16px 20px;
    width: 100%;
    max-width: 420px;
    word-break: break-all;
    display: none;
  }
  .result p { font-size: 0.75rem; color: #8aaa97; margin-bottom: 8px; }
  .result a { color: #6fcf8f; font-size: 0.9rem; font-weight: 600; text-decoration: none; }
  .copy-btn {
    margin-top: 10px;
    background: #1a3d2b;
    color: #6fcf8f;
    padding: 8px;
    font-size: 0.82rem;
    border-radius: 8px;
  }
  .copy-btn:hover { background: #2d6b3e; }
  #status { margin-top: 14px; font-size: 0.85rem; color: #8aaa97; }
</style>
</head>
<body>

<h1>⚔️ KENSHIN ANIME FILE VAULT</h1>

<div class="box" id="dropzone">
  <input type="file" id="fileInput" />
  <div class="icon">📁</div>
  <strong>Click or Drop File Here</strong>
  <p>Images, Videos, GIFs — any file</p>
  <div id="filename"></div>
</div>

<button id="uploadBtn" disabled>Upload & Get Link</button>

<div class="result" id="result">
  <p>Your file link:</p>
  <a id="fileLink" href="#" target="_blank"></a>
  <button class="copy-btn" id="copyBtn">📋 Copy Link</button>
</div>

<div id="status"></div>

<script>
  let file = null;
  const fileInput = document.getElementById('fileInput');
  const uploadBtn = document.getElementById('uploadBtn');
  const status = document.getElementById('status');

  fileInput.addEventListener('change', e => {
    file = e.target.files[0];
    if (file) {
      document.getElementById('filename').textContent = file.name + ' (' + (file.size/1024/1024).toFixed(2) + 'MB)';
      uploadBtn.disabled = false;
    }
  });

  // Drag & drop
  const dropzone = document.getElementById('dropzone');
  dropzone.addEventListener('dragover', e => e.preventDefault());
  dropzone.addEventListener('drop', e => {
    e.preventDefault();
    file = e.dataTransfer.files[0];
    if (file) {
      document.getElementById('filename').textContent = file.name + ' (' + (file.size/1024/1024).toFixed(2) + 'MB)';
      uploadBtn.disabled = false;
    }
  });

  uploadBtn.addEventListener('click', async () => {
    if (!file) return;
    uploadBtn.disabled = true;
    uploadBtn.textContent = 'Uploading...';
    status.textContent = '⏳ Please wait...';
    document.getElementById('result').style.display = 'none';

    const form = new FormData();
    form.append('file', file);

    try {
      const res = await fetch('/upload', { method: 'POST', body: form });
      const data = await res.json();
      if (data.url) {
        document.getElementById('fileLink').textContent = data.url;
        document.getElementById('fileLink').href = data.url;
        document.getElementById('result').style.display = 'block';
        navigator.clipboard.writeText(data.url).catch(()=>{});
        status.textContent = '✅ Done! Link copied to clipboard.';
      } else {
        status.textContent = '❌ Error: ' + (data.error || 'Upload failed');
      }
    } catch(e) {
      status.textContent = '❌ Upload failed. Try again.';
    }

    uploadBtn.disabled = false;
    uploadBtn.textContent = 'Upload & Get Link';
  });

  document.getElementById('copyBtn').addEventListener('click', () => {
    const url = document.getElementById('fileLink').textContent;
    navigator.clipboard.writeText(url).then(() => {
      document.getElementById('copyBtn').textContent = '✅ Copied!';
      setTimeout(() => document.getElementById('copyBtn').textContent = '📋 Copy Link', 2000);
    });
  });
</script>
</body>
</html>
