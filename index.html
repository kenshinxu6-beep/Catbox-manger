<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kenshin Anime — File Vault</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --g: #1a3d2b;
    --g2: #22512f;
    --g3: #2d6b3e;
    --accent: #4caf72;
    --accent2: #6fcf8f;
    --white: #f0f5f1;
    --muted: #8aaa97;
    --bg: #0d1f15;
    --card: #162a1e;
    --border: #1f3d2a;
    --danger: #e05252;
  }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--white);
    min-height: 100vh;
  }

  /* HEADER */
  header {
    background: linear-gradient(135deg, var(--g) 0%, var(--bg) 100%);
    border-bottom: 1px solid var(--border);
    padding: 18px 24px;
    display: flex;
    align-items: center;
    gap: 14px;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(8px);
  }

  .logo-sword {
    font-size: 26px;
    filter: drop-shadow(0 0 8px var(--accent));
  }

  header h1 {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 1.2rem;
    letter-spacing: 0.05em;
    background: linear-gradient(90deg, var(--accent2), var(--white));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  header span {
    font-size: 0.7rem;
    color: var(--muted);
    font-weight: 400;
    margin-left: 4px;
  }

  .header-right {
    margin-left: auto;
    font-size: 0.75rem;
    color: var(--muted);
    text-align: right;
  }

  /* MAIN LAYOUT */
  .container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 28px 16px 60px;
  }

  /* UPLOAD ZONE */
  .upload-card {
    background: var(--card);
    border: 2px dashed var(--g3);
    border-radius: 16px;
    padding: 36px 24px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    position: relative;
    margin-bottom: 28px;
  }

  .upload-card:hover, .upload-card.drag-over {
    border-color: var(--accent);
    background: #1a3322;
  }

  .upload-card input[type="file"] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
    width: 100%;
    height: 100%;
  }

  .upload-icon { font-size: 44px; margin-bottom: 12px; }

  .upload-card h2 {
    font-family: 'Syne', sans-serif;
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--white);
    margin-bottom: 6px;
  }

  .upload-card p {
    font-size: 0.8rem;
    color: var(--muted);
    line-height: 1.5;
  }

  /* CATEGORY SELECT */
  .upload-controls {
    display: flex;
    gap: 10px;
    margin-bottom: 28px;
    flex-wrap: wrap;
    align-items: center;
  }

  .cat-label {
    font-size: 0.8rem;
    color: var(--muted);
    font-weight: 500;
  }

  .cat-btn {
    background: var(--card);
    border: 1.5px solid var(--border);
    color: var(--muted);
    padding: 7px 16px;
    border-radius: 20px;
    font-size: 0.8rem;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    transition: all 0.15s;
  }

  .cat-btn:hover { border-color: var(--accent); color: var(--accent); }
  .cat-btn.active {
    background: var(--g3);
    border-color: var(--accent);
    color: var(--accent2);
    font-weight: 600;
  }

  /* UPLOAD BUTTON */
  .btn-upload {
    background: linear-gradient(135deg, var(--g3), var(--accent));
    color: #fff;
    border: none;
    padding: 12px 28px;
    border-radius: 10px;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 0.9rem;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0 auto 28px;
  }

  .btn-upload:hover { opacity: 0.88; transform: translateY(-1px); }
  .btn-upload:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  /* PROGRESS */
  .progress-bar {
    width: 100%;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin-bottom: 20px;
    overflow: hidden;
    display: none;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 2px;
    animation: shimmer 1.2s infinite;
    width: 0%;
    transition: width 0.3s;
  }

  @keyframes shimmer {
    0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; }
  }

  /* TOAST */
  #toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--g);
    border: 1px solid var(--accent);
    color: var(--white);
    padding: 12px 22px;
    border-radius: 10px;
    font-size: 0.85rem;
    z-index: 999;
    transition: transform 0.3s ease;
    max-width: 340px;
    text-align: center;
  }

  #toast.show { transform: translateX(-50%) translateY(0); }
  #toast.error { border-color: var(--danger); }

  /* FILTER TABS */
  .filter-row {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .filter-tab {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 6px 14px;
    border-radius: 8px;
    font-size: 0.78rem;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    transition: all 0.15s;
  }

  .filter-tab:hover { border-color: var(--g3); color: var(--white); }
  .filter-tab.active { background: var(--g); border-color: var(--accent); color: var(--accent2); font-weight: 600; }

  /* FILES GRID */
  .section-title {
    font-family: 'Syne', sans-serif;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 16px;
  }

  #files-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px;
  }

  .file-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    transition: border-color 0.2s, transform 0.15s;
    position: relative;
  }

  .file-card:hover {
    border-color: var(--g3);
    transform: translateY(-2px);
  }

  .file-preview {
    width: 100%;
    height: 140px;
    object-fit: cover;
    display: block;
    background: var(--g);
  }

  .file-preview-video {
    width: 100%;
    height: 140px;
    object-fit: cover;
    display: block;
  }

  .file-preview-placeholder {
    width: 100%;
    height: 140px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    background: linear-gradient(135deg, var(--g), var(--bg));
  }

  .file-info {
    padding: 10px 12px 12px;
  }

  .file-name {
    font-size: 0.78rem;
    font-weight: 500;
    color: var(--white);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 4px;
  }

  .file-meta {
    font-size: 0.7rem;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .cat-badge {
    font-size: 0.65rem;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 20px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .cat-pfp { background: #1a3d4d; color: #56c2e0; }
  .cat-banner { background: #3d1a3d; color: #d56fe0; }
  .cat-video { background: #3d2a1a; color: #e09b56; }
  .cat-other { background: var(--g); color: var(--accent); }

  .file-actions {
    display: flex;
    gap: 6px;
  }

  .btn-copy, .btn-delete {
    flex: 1;
    padding: 6px;
    border-radius: 7px;
    border: 1px solid var(--border);
    font-size: 0.72rem;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    transition: all 0.15s;
  }

  .btn-copy {
    background: var(--g);
    color: var(--accent2);
    border-color: var(--g3);
  }
  .btn-copy:hover { background: var(--g3); }

  .btn-delete {
    background: transparent;
    color: var(--danger);
    border-color: #3d1a1a;
  }
  .btn-delete:hover { background: #3d1a1a; }

  /* SELECTED FILE PREVIEW */
  #selected-preview {
    margin-bottom: 16px;
    display: none;
    background: var(--g);
    border: 1px solid var(--g3);
    border-radius: 10px;
    padding: 12px;
    text-align: center;
  }

  #selected-preview img {
    max-height: 120px;
    max-width: 100%;
    border-radius: 6px;
    object-fit: contain;
  }

  #selected-preview p {
    font-size: 0.75rem;
    color: var(--muted);
    margin-top: 8px;
  }

  /* EMPTY STATE */
  .empty-state {
    text-align: center;
    padding: 48px 20px;
    color: var(--muted);
    grid-column: 1 / -1;
  }

  .empty-state .empty-icon { font-size: 48px; margin-bottom: 12px; }
  .empty-state p { font-size: 0.85rem; }

  /* STATS */
  .stats-row {
    display: flex;
    gap: 10px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }

  .stat-chip {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 0.78rem;
    color: var(--muted);
  }

  .stat-chip strong {
    color: var(--accent2);
    font-weight: 700;
    margin-right: 4px;
  }

  @media (max-width: 480px) {
    header h1 { font-size: 1rem; }
    .container { padding: 20px 12px 50px; }
    #files-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
  }
</style>
</head>
<body>

<header>
  <div class="logo-sword">⚔️</div>
  <div>
    <h1>KENSHIN ANIME <span>FILE VAULT</span></h1>
  </div>
  <div class="header-right" id="header-stats">Loading...</div>
</header>

<div class="container">

  <!-- Upload Zone -->
  <div class="upload-card" id="dropzone">
    <input type="file" id="file-input" accept="image/*,video/*" />
    <div class="upload-icon">📁</div>
    <h2>Drop your file here</h2>
    <p>PFP / Banner (images up to 8MB) · Videos supported<br/>PNG, JPG, GIF, WEBP, MP4, MKV</p>
  </div>

  <!-- Selected preview -->
  <div id="selected-preview">
    <img id="preview-img" src="" alt="preview" />
    <p id="preview-name"></p>
  </div>

  <!-- Category + Upload -->
  <div class="upload-controls">
    <span class="cat-label">Category:</span>
    <button class="cat-btn active" data-cat="pfp">🖼️ PFP</button>
    <button class="cat-btn" data-cat="banner">🎨 Banner</button>
    <button class="cat-btn" data-cat="video">🎬 Video</button>
    <button class="cat-btn" data-cat="other">📦 Other</button>
  </div>

  <button class="btn-upload" id="upload-btn" disabled>
    ⚔️ Upload to Catbox
  </button>

  <div class="progress-bar" id="progress-bar">
    <div class="progress-fill" id="progress-fill"></div>
  </div>

  <!-- Stats -->
  <div class="stats-row" id="stats-row"></div>

  <!-- Filter -->
  <div class="filter-row">
    <button class="filter-tab active" data-filter="all">All Files</button>
    <button class="filter-tab" data-filter="pfp">PFP</button>
    <button class="filter-tab" data-filter="banner">Banners</button>
    <button class="filter-tab" data-filter="video">Videos</button>
    <button class="filter-tab" data-filter="other">Other</button>
  </div>

  <p class="section-title">Uploaded Files</p>
  <div id="files-grid"></div>
</div>

<div id="toast"></div>

<script>
  let selectedFile = null;
  let selectedCategory = 'pfp';
  let currentFilter = 'all';
  let allFiles = [];

  // Category buttons
  document.querySelectorAll('.cat-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedCategory = btn.dataset.cat;
    });
  });

  // Filter tabs
  document.querySelectorAll('.filter-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentFilter = tab.dataset.filter;
      renderFiles();
    });
  });

  // File input
  const fileInput = document.getElementById('file-input');
  const dropzone = document.getElementById('dropzone');
  const uploadBtn = document.getElementById('upload-btn');

  fileInput.addEventListener('change', (e) => {
    if (e.target.files[0]) handleFileSelect(e.target.files[0]);
  });

  // Drag & drop
  dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('drag-over'); });
  dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag-over'));
  dropzone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropzone.classList.remove('drag-over');
    if (e.dataTransfer.files[0]) handleFileSelect(e.dataTransfer.files[0]);
  });

  function handleFileSelect(file) {
    const maxBytes = 8 * 1024 * 1024;
    if (file.size > maxBytes) {
      showToast(`❌ File too large! Max 8MB. Your file: ${(file.size/1024/1024).toFixed(2)}MB`, 'error');
      return;
    }
    selectedFile = file;
    uploadBtn.disabled = false;

    // Preview
    const preview = document.getElementById('selected-preview');
    const previewImg = document.getElementById('preview-img');
    const previewName = document.getElementById('preview-name');

    if (file.type.startsWith('image/')) {
      const reader = new FileReader();
      reader.onload = (e) => { previewImg.src = e.target.result; previewImg.style.display = 'block'; };
      reader.readAsDataURL(file);
      preview.style.display = 'block';
    } else {
      previewImg.style.display = 'none';
      preview.style.display = 'block';
    }
    previewName.textContent = `${file.name} · ${(file.size/1024/1024).toFixed(2)}MB`;
    dropzone.querySelector('h2').textContent = file.name;
  }

  // Upload
  uploadBtn.addEventListener('click', async () => {
    if (!selectedFile) return;

    const progressBar = document.getElementById('progress-bar');
    const progressFill = document.getElementById('progress-fill');
    progressBar.style.display = 'block';
    progressFill.style.width = '30%';
    uploadBtn.disabled = true;
    uploadBtn.textContent = '⏳ Uploading...';

    const formData = new FormData();
    formData.append('file', selectedFile);
    formData.append('category', selectedCategory);

    try {
      progressFill.style.width = '60%';
      const res = await fetch('/upload', { method: 'POST', body: formData });
      progressFill.style.width = '90%';
      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.detail || 'Upload failed');
      }

      progressFill.style.width = '100%';
      showToast(`✅ Uploaded! URL copied to clipboard.`);
      copyToClipboard(data.url);

      // Reset
      setTimeout(() => {
        progressBar.style.display = 'none';
        progressFill.style.width = '0%';
        selectedFile = null;
        fileInput.value = '';
        uploadBtn.disabled = true;
        uploadBtn.textContent = '⚔️ Upload to Catbox';
        document.getElementById('selected-preview').style.display = 'none';
        dropzone.querySelector('h2').textContent = 'Drop your file here';
        loadFiles();
      }, 1200);

    } catch (err) {
      progressBar.style.display = 'none';
      progressFill.style.width = '0%';
      uploadBtn.disabled = false;
      uploadBtn.textContent = '⚔️ Upload to Catbox';
      showToast(`❌ ${err.message}`, 'error');
    }
  });

  // Load files
  async function loadFiles() {
    try {
      const res = await fetch('/files');
      const data = await res.json();
      allFiles = data.files;
      renderFiles();
      updateStats();
    } catch (e) {
      console.error('Failed to load files', e);
    }
  }

  function renderFiles() {
    const grid = document.getElementById('files-grid');
    const filtered = currentFilter === 'all' ? allFiles : allFiles.filter(f => f.category === currentFilter);

    if (!filtered.length) {
      grid.innerHTML = `<div class="empty-state"><div class="empty-icon">🗡️</div><p>No files here yet. Upload something!</p></div>`;
      return;
    }

    grid.innerHTML = filtered.slice().reverse().map(file => {
      const isImage = file.type && file.type.startsWith('image/');
      const isVideo = file.type && file.type.startsWith('video/');
      const date = new Date(file.uploaded_at).toLocaleDateString('en-IN', { day: '2-digit', month: 'short' });

      let previewHtml = '';
      if (isImage) {
        previewHtml = `<img class="file-preview" src="${file.url}" alt="${file.name}" loading="lazy" onerror="this.style.display='none'" />`;
      } else if (isVideo) {
        previewHtml = `<video class="file-preview-video" src="${file.url}" muted preload="metadata"></video>`;
      } else {
        previewHtml = `<div class="file-preview-placeholder">📄</div>`;
      }

      return `
      <div class="file-card">
        ${previewHtml}
        <div class="file-info">
          <div class="file-name">${file.name}</div>
          <div class="file-meta">
            <span class="cat-badge cat-${file.category}">${file.category}</span>
            <span>${file.size_mb}MB · ${date}</span>
          </div>
          <div class="file-actions">
            <button class="btn-copy" onclick="copyURL('${file.url}')">📋 Copy URL</button>
            <button class="btn-delete" onclick="deleteFile(${file.id})">🗑️</button>
          </div>
        </div>
      </div>`;
    }).join('');
  }

  function updateStats() {
    const statsRow = document.getElementById('stats-row');
    const total = allFiles.length;
    const totalMB = allFiles.reduce((s, f) => s + (f.size_mb || 0), 0).toFixed(2);
    const cats = { pfp: 0, banner: 0, video: 0, other: 0 };
    allFiles.forEach(f => { if (cats[f.category] !== undefined) cats[f.category]++; });

    statsRow.innerHTML = `
      <div class="stat-chip"><strong>${total}</strong> Total Files</div>
      <div class="stat-chip"><strong>${totalMB}MB</strong> Stored</div>
      <div class="stat-chip"><strong>${cats.pfp}</strong> PFPs</div>
      <div class="stat-chip"><strong>${cats.banner}</strong> Banners</div>
      <div class="stat-chip"><strong>${cats.video}</strong> Videos</div>
    `;

    document.getElementById('header-stats').textContent = `${total} files · ${totalMB}MB`;
  }

  async function deleteFile(id) {
    if (!confirm('Delete this file from records?')) return;
    try {
      const res = await fetch(`/delete/${id}`, { method: 'DELETE' });
      const data = await res.json();
      showToast(`🗑️ ${data.message}`);
      loadFiles();
    } catch (e) {
      showToast('❌ Delete failed', 'error');
    }
  }

  function copyURL(url) {
    copyToClipboard(url);
    showToast('📋 URL copied!');
  }

  function copyToClipboard(text) {
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
    } else {
      fallbackCopy(text);
    }
  }

  function fallbackCopy(text) {
    const el = document.createElement('textarea');
    el.value = text;
    document.body.appendChild(el);
    el.select();
    document.execCommand('copy');
    document.body.removeChild(el);
  }

  let toastTimer;
  function showToast(msg, type = '') {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.className = 'show' + (type ? ' ' + type : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toast.className = ''; }, 3000);
  }

  // Init
  loadFiles();
</script>
</body>
</html>
