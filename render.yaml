services:
  - type: web
    name: kenshin-anime-file-vault
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CATBOX_USERHASH
        value: ""   # Optional: paste your Catbox userhash here for account uploads + delete support
    disk:
      name: vault-storage
      mountPath: /opt/render/project/src
      sizeGB: 1
